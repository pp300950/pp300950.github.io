<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>บ้านเก่า - Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@400;600&family=Sarabun:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-black: #0a0908;
    --fog-green: #3a4a3f;
    --candle: #8a5a3c;
    --paper: #d4c9a8;
    --blood: #5c1a1a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: var(--bg-black);
    overflow: hidden;
    font-family: 'Sarabun', sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  #game-container {
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* Vignette overlay for horror atmosphere */
  #vignette {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.85) 100%);
    z-index: 10;
  }

  /* Loading screen */
  #loading-screen {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: var(--bg-black);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    transition: opacity 1s ease;
  }

  #loading-screen h1 {
    font-family: 'Noto Serif Thai', serif;
    color: var(--paper);
    font-size: 1.8rem;
    letter-spacing: 0.1em;
    opacity: 0.85;
    margin-bottom: 2rem;
  }

  .loading-bar-track {
    width: 60%;
    max-width: 300px;
    height: 2px;
    background: rgba(212,201,168,0.15);
  }

  .loading-bar-fill {
    height: 100%;
    width: 0%;
    background: var(--candle);
    transition: width 0.3s ease;
  }

  #loading-hint {
    margin-top: 1.5rem;
    color: var(--fog-green);
    font-size: 0.8rem;
    letter-spacing: 0.05em;
  }

  /* Start screen */
  #start-screen {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(10,9,8,0.92);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 90;
    text-align: center;
    padding: 2rem;
  }

  #start-screen.visible { display: flex; }

  #start-screen h1 {
    font-family: 'Noto Serif Thai', serif;
    color: var(--paper);
    font-size: 2.2rem;
    margin-bottom: 0.5rem;
    letter-spacing: 0.05em;
  }

  #start-screen p {
    color: var(--fog-green);
    font-size: 0.9rem;
    margin-bottom: 3rem;
    max-width: 280px;
    line-height: 1.6;
  }

  #start-btn {
    font-family: 'Noto Serif Thai', serif;
    background: transparent;
    border: 1px solid var(--candle);
    color: var(--paper);
    padding: 0.9rem 2.5rem;
    font-size: 1rem;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  #start-btn:active {
    background: var(--candle);
    color: var(--bg-black);
  }

  /* Narrative text box */
  #narrative-box {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    padding: 1.5rem 1.5rem 2.5rem;
    background: linear-gradient(to top, rgba(10,9,8,0.97) 40%, rgba(10,9,8,0.8) 80%, transparent 100%);
    z-index: 20;
    opacity: 0;
    transition: opacity 0.6s ease;
    pointer-events: none;
  }

  #narrative-box.visible {
    opacity: 1;
    pointer-events: auto;
  }

  #narrative-text {
    font-family: 'Noto Serif Thai', serif;
    color: var(--paper);
    font-size: 1.05rem;
    line-height: 1.9;
    min-height: 3.8em;
    letter-spacing: 0.02em;
  }

  #narrative-text .cursor {
    display: inline-block;
    width: 2px;
    height: 1em;
    background: var(--candle);
    margin-left: 2px;
    animation: blink 1s step-start infinite;
    vertical-align: middle;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  #continue-hint {
    margin-top: 1rem;
    text-align: right;
    color: var(--fog-green);
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    opacity: 0;
    transition: opacity 0.4s ease;
  }

  #continue-hint.visible {
    opacity: 0.7;
    animation: pulse-hint 2s ease-in-out infinite;
  }

  @keyframes pulse-hint {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 0.9; }
  }

  /* Tap anywhere overlay */
  #tap-layer {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 15;
  }

  /* Debug/dev info - can remove later */
  #dev-info {
    position: fixed;
    top: 0.5rem;
    left: 0.5rem;
    color: rgba(212,201,168,0.3);
    font-size: 0.65rem;
    font-family: monospace;
    z-index: 50;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="loading-screen">
  <h1>บ้านเก่า</h1>
  <div class="loading-bar-track"><div class="loading-bar-fill" id="loading-fill"></div></div>
  <div id="loading-hint">กำลังโหลด...</div>
</div>

<div id="start-screen">
  <h1>บ้านเก่า</h1>
  <p>เรื่องเล่าเกี่ยวกับบ้านร้างหลังหนึ่ง<br>ที่ไม่มีใครกล้าเข้าไปอีกเลย<br><br>แตะเพื่อเดินต่อไปเรื่อยๆ</p>
  <button id="start-btn">เริ่มเรื่อง</button>
</div>

<div id="game-container">
  <div id="vignette"></div>
  <div id="tap-layer"></div>
  <div id="narrative-box">
    <div id="narrative-text"></div>
    <div id="continue-hint">แตะเพื่อไปต่อ</div>
  </div>
  <div id="dev-info"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============================================================
   บ้านเก่า - Ghost Walking-Sim Prototype
   Auto-walk narrative horror game, portrait-optimized
   ============================================================ */

// ---------- STORY DATA ----------
// Each "beat" = a stop point along the curved path where the walk pauses and text plays.
// t: progress along the path spline, 0 = start, 1 = end (path is curved, not straight)
// text: narrative line(s) to type out
// lightFlicker / ghostReveal: optional trigger flags
const STORY_BEATS = [
  {
    t: 0.0,
    text: "เสียงเปิดประตูรั้วเหล็กดังเอี๊ยด แม้จะไม่มีใครแตะต้องมันมาหลายปีแล้ว"
  },
  {
    t: 0.18,
    text: "หญ้าสูงท่วมเข่าขึ้นปกคลุมทางเดินเก่า กลิ่นดินชื้นปนกลิ่นธูปจางๆ ลอยมาตามลม"
  },
  {
    t: 0.36,
    text: "ทางเดินคดเคี้ยวผ่านแนวต้นไม้ทึบ กิ่งก้านบิดตัวเหมือนจงใจปิดกั้นแสงจันทร์"
  },
  {
    t: 0.54,
    text: "บ้านหลังนี้เคยมีคนอยู่... นานมาแล้ว ก่อนที่ทุกอย่างจะเงียบไปในคืนเดียว"
  },
  {
    t: 0.7,
    text: "หน้าต่างบานหนึ่งเปิดแง้มอยู่ ม่านสีขาวที่เคยขาวพลิ้วไหวราวกับมีคนอยู่ข้างใน",
    lightFlicker: true
  },
  {
    t: 0.86,
    text: "มีบางอย่างขยับอยู่ในความมืดข้างหน้า... หรือเป็นแค่เงาของกิ่งไม้",
    ghostReveal: true
  },
  {
    t: 1.0,
    text: "เสียงกระซิบแผ่วเบาเรียกชื่อที่คุณไม่เคยบอกใคร"
  }
];

// ---------- PATH DEFINITION ----------
// Waypoints for a winding path (X = left/right sway, Z = forward progress, always negative/decreasing).
// This replaces the old straight-line walk. Curve is built with CatmullRomCurve3 for smooth turns.
const PATH_WAYPOINTS = [
  new THREE.Vector3(0, 1.6, 6),
  new THREE.Vector3(1.2, 1.6, -4),
  new THREE.Vector3(-1.8, 1.6, -14),
  new THREE.Vector3(-0.5, 1.6, -24),
  new THREE.Vector3(2.0, 1.6, -34),
  new THREE.Vector3(1.0, 1.6, -46),
  new THREE.Vector3(-1.2, 1.6, -58),
  new THREE.Vector3(-1.5, 1.6, -70),
  new THREE.Vector3(0, 1.6, -84)
];
let pathCurve = null;

// ---------- SCENE SETUP ----------
let scene, camera, renderer;
let pathGroup, ghostSlot;
let currentBeat = -1;
let isWalking = false;
let isTyping = false;
let typeInterval = null;
let ghostModel = null; // will hold loaded .glb model later
let flickerLight = null;
let clock = new THREE.Clock();

function initScene() {
  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x0a0908, 0.05);
  scene.background = new THREE.Color(0x0a0908);

  // Build the winding path curve once, reused for camera movement + ground placement
  pathCurve = new THREE.CatmullRomCurve3(PATH_WAYPOINTS, false, 'catmullrom', 0.5);

  // Portrait-friendly camera: narrower FOV feels less "wide angle horror movie", more intimate
  camera = new THREE.PerspectiveCamera(
    55,
    window.innerWidth / window.innerHeight,
    0.1,
    100
  );
  const startPoint = pathCurve.getPointAt(0);
  const startLook = pathCurve.getPointAt(0.02);
  camera.position.copy(startPoint);
  camera.lookAt(startLook.x, startPoint.y, startLook.z);

  renderer = new THREE.WebGLRenderer({
    antialias: false, // OFF for low-end GPU performance (GT730-class)
    powerPreference: "low-power"
  });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); // cap pixel ratio, big perf win on mobile
  renderer.shadowMap.enabled = false; // shadows are expensive, skip for prototype
  document.getElementById('game-container').appendChild(renderer.domElement);

  buildEnvironment();
  buildLighting();

  window.addEventListener('resize', onResize);
}

// ---------- LOW-POLY ENVIRONMENT ----------
function buildEnvironment() {
  pathGroup = new THREE.Group();
  scene.add(pathGroup);

  // Ground - wide flat plane under everything, dirt color
  const groundGeo = new THREE.PlaneGeometry(30, 120);
  const groundMat = new THREE.MeshStandardMaterial({
    color: 0x2b2620,
    roughness: 1,
    flatShading: true
  });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.position.set(0, 0, -40);
  pathGroup.add(ground);

  // Winding trail strip that actually follows the curved path (worn dirt color),
  // built by sampling the curve and generating a ribbon of quads along it.
  buildTrailRibbon();

  // Branch-like low-poly trees, scattered along both sides of the curved path.
  // Built from a trunk + several angled branch cylinders instead of a plain cone,
  // so silhouettes read as bare/gnarled trees rather than Christmas-tree shapes.
  buildForest();

  // The house - simple low-poly silhouette, placed at the far end
  buildHouse();

  // A few grave-marker-like stones for atmosphere (Thai rural horror staple),
  // offset out from sampled points along the curved path.
  const stoneGeo = new THREE.BoxGeometry(0.4, 0.6, 0.15);
  const stoneMat = new THREE.MeshStandardMaterial({ color: 0x4a4640, flatShading: true, roughness: 1 });
  const stoneTs = [0.28, 0.32, 0.44, 0.48, 0.6];
  stoneTs.forEach((t) => {
    const pt = pathCurve.getPointAt(t);
    const side = Math.random() > 0.5 ? 1 : -1;
    const stone = new THREE.Mesh(stoneGeo, stoneMat);
    stone.position.set(pt.x + side * (3.2 + Math.random() * 1.5), 0.3, pt.z);
    stone.rotation.y = Math.random() * 0.6 - 0.3;
    stone.rotation.z = Math.random() * 0.15;
    pathGroup.add(stone);
  });
}

// ---------- WINDING TRAIL RIBBON ----------
// Samples the path curve and builds a flat ribbon mesh that visually traces the walk route.
function buildTrailRibbon() {
  const segments = 60;
  const halfWidth = 1.1;
  const positions = [];
  const indices = [];

  for (let i = 0; i <= segments; i++) {
    const t = i / segments;
    const point = pathCurve.getPointAt(t);
    const tangent = pathCurve.getTangentAt(t);
    // perpendicular on the XZ plane
    const perp = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();

    const left = point.clone().addScaledVector(perp, halfWidth);
    const right = point.clone().addScaledVector(perp, -halfWidth);

    positions.push(left.x, 0.015, left.z);
    positions.push(right.x, 0.015, right.z);

    if (i < segments) {
      const a = i * 2, b = i * 2 + 1, c = i * 2 + 2, d = i * 2 + 3;
      indices.push(a, b, c, b, d, c);
    }
  }

  const trailGeo = new THREE.BufferGeometry();
  trailGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  trailGeo.setIndex(indices);
  trailGeo.computeVertexNormals();

  const trailMat = new THREE.MeshStandardMaterial({
    color: 0x3d3528,
    roughness: 1,
    flatShading: true
  });
  const trail = new THREE.Mesh(trailGeo, trailMat);
  pathGroup.add(trail);
}

// ---------- FOREST (branch-style trees along the curve) ----------
function buildForest() {
  const treeCount = 26;
  for (let i = 0; i < treeCount; i++) {
    // Spread trees across the whole path length, alternating sides,
    // with jitter so it doesn't look like a planted row.
    const t = 0.04 + (i / treeCount) * 0.94 + (Math.random() * 0.02 - 0.01);
    const point = pathCurve.getPointAt(Math.min(Math.max(t, 0), 1));
    const tangent = pathCurve.getTangentAt(Math.min(Math.max(t, 0), 1));
    const perp = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();

    const side = i % 2 === 0 ? 1 : -1;
    const offset = 2.8 + Math.random() * 3.5; // distance from path center
    const pos = point.clone().addScaledVector(perp, side * offset);

    const scale = 0.75 + Math.random() * 0.7;
    const tree = buildTree(scale);
    tree.position.set(pos.x, 0, pos.z);
    tree.rotation.y = Math.random() * Math.PI * 2;
    pathGroup.add(tree);
  }
}

// Builds one gnarled low-poly tree: a leaning trunk plus several angled branch
// cylinders (no leaf canopy), so it reads as bare/dead rather than a Christmas tree.
const treeTrunkMat = new THREE.MeshStandardMaterial({ color: 0x1c1712, flatShading: true, roughness: 1 });
const treeBranchMat = new THREE.MeshStandardMaterial({ color: 0x161210, flatShading: true, roughness: 1 });

function buildTree(scale) {
  const tree = new THREE.Group();

  const trunkHeight = 2.4 * scale;
  const trunkGeo = new THREE.CylinderGeometry(0.08 * scale, 0.22 * scale, trunkHeight, 5);
  const trunk = new THREE.Mesh(trunkGeo, treeTrunkMat);
  trunk.position.y = trunkHeight / 2;
  trunk.rotation.z = (Math.random() - 0.5) * 0.15; // slight lean
  tree.add(trunk);

  // 3-5 gnarled branches jutting out at irregular angles from the upper trunk
  const branchCount = 3 + Math.floor(Math.random() * 3);
  for (let b = 0; b < branchCount; b++) {
    const branchLen = (0.8 + Math.random() * 0.9) * scale;
    const branchGeo = new THREE.CylinderGeometry(0.03 * scale, 0.07 * scale, branchLen, 4);
    const branch = new THREE.Mesh(branchGeo, treeBranchMat);

    const heightAlongTrunk = trunkHeight * (0.55 + Math.random() * 0.4);
    const angleAroundTrunk = Math.random() * Math.PI * 2;
    const tiltFromVertical = 0.9 + Math.random() * 0.6; // mostly horizontal-ish, gnarled

    branch.position.set(
      Math.cos(angleAroundTrunk) * 0.15 * scale,
      heightAlongTrunk,
      Math.sin(angleAroundTrunk) * 0.15 * scale
    );
    branch.rotation.z = tiltFromVertical * (Math.random() > 0.5 ? 1 : -1);
    branch.rotation.y = angleAroundTrunk;
    // shift branch outward along its own tilted axis so it juts from the trunk surface
    branch.translateY(branchLen / 2);
    tree.add(branch);
  }

  return tree;
}

// Two-story Thai-style wooden house on stilts (เรือนไทย), aged and eerie:
// tall stilt legs, an underfloor void, an upper living floor, a steep gable roof
// with the crossed "ปั้นลม" ridge horns silhouette, a wraparound railing, and one
// warm flickering window. All built from low-poly primitives, no textures needed.
function buildHouse() {
  const houseGroup = new THREE.Group();
  const housePoint = pathCurve.getPointAt(1.0);
  const houseTangent = pathCurve.getTangentAt(1.0);
  houseGroup.position.set(housePoint.x, 0, housePoint.z - 6);
  houseGroup.rotation.y = Math.atan2(houseTangent.x, houseTangent.z);

  const woodDark = new THREE.MeshStandardMaterial({ color: 0x1a1512, flatShading: true, roughness: 1 });
  const woodMid = new THREE.MeshStandardMaterial({ color: 0x241d17, flatShading: true, roughness: 1 });
  const roofMat = new THREE.MeshStandardMaterial({ color: 0x0e0b09, flatShading: true, roughness: 1 });
  const railMat = new THREE.MeshStandardMaterial({ color: 0x1e1710, flatShading: true, roughness: 1 });

  const stiltHeight = 2.4;
  const floorW = 7, floorD = 5.5;

  // --- Stilts (ใต้ถุนบ้าน - the raised understory, classic Thai house feature) ---
  const stiltGeo = new THREE.CylinderGeometry(0.16, 0.2, stiltHeight, 5);
  const stiltOffsets = [
    [-floorW/2+0.4, -floorD/2+0.4], [floorW/2-0.4, -floorD/2+0.4],
    [-floorW/2+0.4, floorD/2-0.4],  [floorW/2-0.4, floorD/2-0.4],
    [0, -floorD/2+0.4], [0, floorD/2-0.4]
  ];
  stiltOffsets.forEach(([x, z]) => {
    const stilt = new THREE.Mesh(stiltGeo, woodDark);
    stilt.position.set(x, stiltHeight / 2, z);
    houseGroup.add(stilt);
  });

  // --- Main floor / first story body ---
  const bodyH = 2.6;
  const body = new THREE.Mesh(new THREE.BoxGeometry(floorW, bodyH, floorD), woodMid);
  body.position.y = stiltHeight + bodyH / 2;
  houseGroup.add(body);

  // --- Wraparound railing (ระเบียง) - thin box strips instead of true balusters, cheap on polys ---
  const railGeo = new THREE.BoxGeometry(floorW + 0.6, 0.08, 0.08);
  const railSideGeo = new THREE.BoxGeometry(0.08, 0.08, floorD + 0.6);
  const railY = stiltHeight - 0.15;
  const railFront = new THREE.Mesh(railGeo, railMat);
  railFront.position.set(0, railY, floorD/2 + 0.3);
  houseGroup.add(railFront);
  const railBack = railFront.clone();
  railBack.position.z = -floorD/2 - 0.3;
  houseGroup.add(railBack);
  const railLeft = new THREE.Mesh(railSideGeo, railMat);
  railLeft.position.set(-floorW/2 - 0.3, railY, 0);
  houseGroup.add(railLeft);
  const railRight = railLeft.clone();
  railRight.position.x = floorW/2 + 0.3;
  houseGroup.add(railRight);

  // --- Upper second story (smaller footprint, sits back like a Thai house's second floor) ---
  const upperW = floorW * 0.72, upperD = floorD * 0.72, upperH = 2.3;
  const upperBody = new THREE.Mesh(new THREE.BoxGeometry(upperW, upperH, upperD), woodMid);
  upperBody.position.y = stiltHeight + bodyH + upperH / 2;
  houseGroup.add(upperBody);

  // --- Steep gable roof over the upper story ---
  const roofBase = new THREE.Mesh(new THREE.ConeGeometry(upperW * 0.85, 2.6, 4), roofMat);
  roofBase.position.y = stiltHeight + bodyH + upperH + 1.3;
  roofBase.rotation.y = Math.PI / 4;
  houseGroup.add(roofBase);

  // Smaller secondary roof cap over the ground-floor body for a layered Thai-roof silhouette
  const roofLower = new THREE.Mesh(new THREE.ConeGeometry(floorW * 0.62, 1.1, 4), roofMat);
  roofLower.position.y = stiltHeight + bodyH + 0.4;
  roofLower.rotation.y = Math.PI / 4;
  roofLower.scale.set(1.5, 1, 1);
  houseGroup.add(roofLower);

  // --- Crossed roof-ridge horns (ปั้นลม silhouette) - two thin angled struts at the peak ---
  const hornGeo = new THREE.CylinderGeometry(0.03, 0.03, 1.4, 4);
  const hornY = stiltHeight + bodyH + upperH + 2.5;
  const hornL = new THREE.Mesh(hornGeo, woodDark);
  hornL.position.set(0, hornY, upperD/2);
  hornL.rotation.x = 0.5;
  houseGroup.add(hornL);
  const hornR = hornL.clone();
  hornR.position.z = -upperD/2;
  hornR.rotation.x = -0.5;
  houseGroup.add(hornR);

  // --- Glowing window on the upper floor (flicker target - the "someone's home" light) ---
  const windowGeo = new THREE.PlaneGeometry(0.9, 1.3);
  const windowMat = new THREE.MeshBasicMaterial({ color: 0x8a5a3c, transparent: true, opacity: 0.55 });
  const win = new THREE.Mesh(windowGeo, windowMat);
  win.position.set(-upperW/2 + 1.1, stiltHeight + bodyH + upperH/2, upperD/2 + 0.02);
  houseGroup.add(win);
  houseGroup.userData.window = win;

  // A second, dark (dead) window beside it for asymmetry/unease
  const winDark = win.clone();
  winDark.material = new THREE.MeshBasicMaterial({ color: 0x050403, transparent: true, opacity: 0.9 });
  winDark.position.x = upperW/2 - 1.1;
  houseGroup.add(winDark);

  // --- Ground-floor door, slightly ajar-looking via dark plane ---
  const doorGeo = new THREE.PlaneGeometry(1.1, 1.9);
  const doorMat = new THREE.MeshBasicMaterial({ color: 0x030201 });
  const door = new THREE.Mesh(doorGeo, doorMat);
  door.position.set(0, stiltHeight + 0.95, floorD/2 + 0.02);
  houseGroup.add(door);

  pathGroup.add(houseGroup);
  pathGroup.userData.house = houseGroup;
}

// ---------- GHOST MODEL SLOT ----------
// Placeholder box now; swap for GLTFLoader when a .glb is provided.
function buildGhostPlaceholder() {
  ghostSlot = new THREE.Group();

  // Simple silhouette placeholder - a tall thin shrouded shape
  const bodyGeo = new THREE.ConeGeometry(0.5, 2.2, 8, 1, true);
  const bodyMat = new THREE.MeshStandardMaterial({
    color: 0x0d0d0d,
    flatShading: true,
    roughness: 1,
    side: THREE.DoubleSide
  });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.position.y = 1.1;
  ghostSlot.add(body);

  // Position just off the path near the ghostReveal story beat (t ≈ 0.86)
  const ghostT = 0.82;
  const ghostPoint = pathCurve.getPointAt(ghostT);
  const ghostTangent = pathCurve.getTangentAt(ghostT);
  const ghostPerp = new THREE.Vector3(-ghostTangent.z, 0, ghostTangent.x).normalize();
  const ghostPos = ghostPoint.clone().addScaledVector(ghostPerp, -2.2);
  ghostSlot.position.set(ghostPos.x, 0, ghostPos.z);
  ghostSlot.visible = false;
  pathGroup.add(ghostSlot);
}

  loader.load('models/ghost.glb', (gltf) => {
    ghostModel = gltf.scene;
    ghostModel.scale.set(1, 1, 1);
    ghostSlot.add(ghostModel);
    body.visible = false; // hide placeholder once real model loads
  });

  Note: r128 three.min.js does NOT include GLTFLoader by default -

// ---------- LIGHTING ----------
function buildLighting() {
  const ambient = new THREE.AmbientLight(0x3a4a3f, 0.35);
  scene.add(ambient);

  const moonLight = new THREE.DirectionalLight(0x4a5a5f, 0.4);
  moonLight.position.set(-5, 10, 5);
  scene.add(moonLight);

  // Warm flickering light near the house window
  flickerLight = new THREE.PointLight(0x8a5a3c, 1.2, 12);
  flickerLight.position.set(-1.5, 2.3, -75);
  scene.add(flickerLight);
}

// ---------- CAMERA WALK (follows the curved path spline) ----------
let currentPathT = 0; // where the camera currently sits along the curve, 0-1

function walkToBeat(index) {
  if (index >= STORY_BEATS.length) return;
  isWalking = true;
  hideNarrativeBox();

  const fromT = currentPathT;
  const toT = STORY_BEATS[index].t;
  // Pace the walk by distance along the curve so short and long stretches feel consistent
  const duration = 1800 + Math.abs(toT - fromT) * 4200;

  animateWalk(fromT, toT, duration, () => {
    isWalking = false;
    currentPathT = toT;
    currentBeat = index;
    triggerBeatEffects(STORY_BEATS[index]);
    showNarrativeText(STORY_BEATS[index].text);
  });
}

function animateWalk(fromT, toT, duration, onComplete) {
  const start = performance.now();
  function step(now) {
    const rawT = Math.min((now - start) / duration, 1);
    const eased = rawT < 0.5 ? 2 * rawT * rawT : 1 - Math.pow(-2 * rawT + 2, 2) / 2; // ease-in-out-quad
    const pathT = fromT + (toT - fromT) * eased;

    // Sample the curve for position, and slightly ahead for a look-at target
    // so the camera naturally turns into upcoming bends instead of staying forward-locked.
    const clampedT = Math.min(Math.max(pathT, 0), 1);
    const lookAheadT = Math.min(clampedT + 0.03, 1);
    const point = pathCurve.getPointAt(clampedT);
    const lookPoint = pathCurve.getPointAt(lookAheadT);

    // subtle handheld sway for unease, applied as a small offset perpendicular to travel direction
    const tangent = pathCurve.getTangentAt(clampedT);
    const perp = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();
    const sway = Math.sin(now * 0.0012) * 0.06;
    const bob = Math.sin(now * 0.0022) * 0.035;

    camera.position.set(
      point.x + perp.x * sway,
      1.6 + bob,
      point.z + perp.z * sway
    );
    camera.lookAt(lookPoint.x, 1.6, lookPoint.z);

    if (rawT < 1) {
      requestAnimationFrame(step);
    } else {
      onComplete();
    }
  }
  requestAnimationFrame(step);
}

function triggerBeatEffects(beat) {
  if (beat.ghostReveal && ghostSlot) {
    ghostSlot.visible = true;
  }
  if (beat.lightFlicker) {
    doLightFlicker();
  }
}

function doLightFlicker() {
  let flickers = 0;
  const maxFlickers = 6;
  const interval = setInterval(() => {
    flickerLight.intensity = flickerLight.intensity > 0.3 ? 0.15 : 1.3;
    flickers++;
    if (flickers >= maxFlickers) {
      clearInterval(interval);
      flickerLight.intensity = 1.2;
    }
  }, 140);
}

// ---------- NARRATIVE TEXT (typewriter) ----------
const narrativeBox = document.getElementById('narrative-box');
const narrativeText = document.getElementById('narrative-text');
const continueHint = document.getElementById('continue-hint');

function showNarrativeText(text) {
  narrativeBox.classList.add('visible');
  continueHint.classList.remove('visible');
  narrativeText.innerHTML = '<span class="cursor"></span>';
  isTyping = true;

  let i = 0;
  clearInterval(typeInterval);
  typeInterval = setInterval(() => {
    if (i < text.length) {
      narrativeText.innerHTML = text.substring(0, i + 1) + '<span class="cursor"></span>';
      i++;
    } else {
      clearInterval(typeInterval);
      isTyping = false;
      continueHint.classList.add('visible');
    }
  }, 45); // typing speed
}

function hideNarrativeBox() {
  narrativeBox.classList.remove('visible');
  continueHint.classList.remove('visible');
}

function skipTyping() {
  const fullText = STORY_BEATS[currentBeat].text;
  clearInterval(typeInterval);
  narrativeText.innerHTML = fullText;
  isTyping = false;
  continueHint.classList.add('visible');
}

// ---------- INPUT ----------
document.getElementById('tap-layer').addEventListener('click', handleTap);

function handleTap() {
  if (isWalking) return; // ignore taps mid-walk, prevents skipping animation awkwardly

  if (isTyping) {
    skipTyping();
    return;
  }

  const nextIndex = currentBeat + 1;
  if (nextIndex < STORY_BEATS.length) {
    walkToBeat(nextIndex);
  } else {
    // Story end for this prototype
    narrativeText.innerHTML = "— จบ Prototype —";
    continueHint.classList.remove('visible');
  }
}

document.getElementById('start-btn').addEventListener('click', () => {
  document.getElementById('start-screen').classList.remove('visible');
  walkToBeat(0);
});

// ---------- RESIZE ----------
function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

// ---------- RENDER LOOP ----------
function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();

  // gentle ambient window glow pulse even when not flickering deliberately
  if (flickerLight && !isWalking) {
    flickerLight.intensity = 1.2 + Math.sin(elapsed * 2) * 0.08;
  }

  // idle bob for ghost placeholder once revealed
  if (ghostSlot && ghostSlot.visible) {
    ghostSlot.position.y = Math.sin(elapsed * 1.2) * 0.08;
  }

  renderer.render(scene, camera);
}

// ---------- BOOT SEQUENCE ----------
function boot() {
  initScene();
  buildGhostPlaceholder();
  animate();

  // Fake short loading bar (real asset loading will replace this later)
  const fill = document.getElementById('loading-fill');
  let progress = 0;
  const loadTimer = setInterval(() => {
    progress += 18;
    fill.style.width = Math.min(progress, 100) + '%';
    if (progress >= 100) {
      clearInterval(loadTimer);
      setTimeout(() => {
        document.getElementById('loading-screen').style.opacity = '0';
        setTimeout(() => {
          document.getElementById('loading-screen').style.display = 'none';
          document.getElementById('start-screen').classList.add('visible');
        }, 1000);
      }, 200);
    }
  }, 90);

  // Dev info for testing on your machine - shows FPS-ish frame timing
  const devInfo = document.getElementById('dev-info');
  let frames = 0, lastCheck = performance.now();
  setInterval(() => {
    devInfo.textContent = `beat: ${currentBeat + 1}/${STORY_BEATS.length}`;
  }, 300);
}

boot();
</script>
