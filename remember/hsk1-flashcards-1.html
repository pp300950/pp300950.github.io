<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>HSK1 ท่องศัพท์</title>
<style>
  @font-face {
    font-family: 'system';
  }
  :root{
    --paper:#F6F1E7;
    --ink:#2B2620;
    --seal:#B23A2E;
    --seal-dark:#8C2C22;
    --gold:#C79A3E;
    --line:#D8CCB0;
    --card:#FFFDF8;
    --green:#4C7A5E;
    --muted:#8A7F68;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:
      radial-gradient(circle at 15% 8%, rgba(178,58,46,0.05), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(199,154,62,0.07), transparent 45%);
    color:var(--ink);
    font-family:'Noto Sans Thai','Noto Sans','Segoe UI',sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:24px 16px 60px;
  }
  .wrap{width:100%;max-width:480px;}

  header{
    text-align:center;
    margin-bottom:22px;
    position:relative;
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:.22em;
    color:var(--seal);
    text-transform:uppercase;
    font-weight:700;
  }
  h1{
    font-family:'Noto Serif Thai','Georgia',serif;
    font-size:30px;
    margin:4px 0 2px;
    font-weight:700;
    letter-spacing:.01em;
  }
  .sub{font-size:13px;color:var(--muted);}

  .progress-row{
    display:flex;align-items:center;gap:10px;
    margin:18px 0 4px;
  }
  .progress-track{
    flex:1;height:6px;background:var(--line);border-radius:4px;overflow:hidden;
  }
  .progress-fill{
    height:100%;background:linear-gradient(90deg,var(--gold),var(--seal));
    width:0%;transition:width .35s ease;
  }
  .progress-num{
    font-variant-numeric:tabular-nums;
    font-size:13px;color:var(--muted);white-space:nowrap;
  }

  .stats{
    display:flex;justify-content:space-between;
    font-size:12px;color:var(--muted);margin-bottom:18px;
  }
  .stats b{color:var(--ink);}
  .stat-ok{color:var(--green);font-weight:700;}
  .stat-no{color:var(--seal);font-weight:700;}

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    padding:38px 26px 30px;
    text-align:center;
    box-shadow:0 1px 0 rgba(0,0,0,0.03), 0 12px 30px -18px rgba(43,38,32,0.35);
    position:relative;
    min-height:230px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }
  .card-index{
    position:absolute;top:16px;left:18px;
    font-size:12px;color:var(--muted);
    font-variant-numeric:tabular-nums;
    letter-spacing:.05em;
  }
  .card-mode{
    position:absolute;top:16px;right:18px;
    font-size:10.5px;color:var(--gold);
    text-transform:uppercase;letter-spacing:.14em;font-weight:700;
    border:1px solid var(--gold);
    border-radius:20px;
    padding:3px 10px;
  }
  .prompt-label{
    font-size:12px;color:var(--muted);margin-bottom:10px;letter-spacing:.05em;
  }
  .prompt-text{
    font-family:'Noto Serif Thai','Georgia',serif;
    font-size:34px;
    font-weight:700;
    line-height:1.25;
    word-break:break-word;
  }
  .prompt-text.pinyin{color:var(--seal-dark);}
  .prompt-text.thai{color:var(--ink); font-size:28px;}

  form{margin-top:22px;width:100%;}
  input[type=text]{
    width:100%;
    font-size:18px;
    padding:13px 16px;
    border-radius:12px;
    border:1.5px solid var(--line);
    background:#fff;
    text-align:center;
    color:var(--ink);
    font-family:inherit;
  }
  input[type=text]:focus{
    outline:none;
    border-color:var(--seal);
    box-shadow:0 0 0 3px rgba(178,58,46,0.12);
  }
  .actions{
    display:flex;gap:10px;margin-top:14px;
  }

  .choice-grid{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top:22px;
    width:100%;
  }
  .choice-btn{
    width:100%;
    text-align:left;
    background:#fff;
    border:1.5px solid var(--line);
    border-radius:12px;
    padding:13px 16px;
    font-size:16px;
    font-weight:600;
    color:var(--ink);
    font-family:inherit;
    display:flex;
    align-items:center;
    gap:12px;
    cursor:pointer;
  }
  .choice-btn .choice-tag{
    font-size:12px;
    font-weight:700;
    color:var(--muted);
    border:1px solid var(--line);
    border-radius:6px;
    width:22px;height:22px;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .choice-btn:active{transform:scale(0.98);}
  .choice-btn.correct{
    border-color:var(--green);
    background:rgba(76,122,94,0.10);
  }
  .choice-btn.correct .choice-tag{border-color:var(--green);color:var(--green);}
  .choice-btn.wrong{
    border-color:var(--seal);
    background:rgba(178,58,46,0.07);
  }
  .choice-btn.wrong .choice-tag{border-color:var(--seal);color:var(--seal);}
  .choice-btn.dim{opacity:0.5;}
  .choice-btn:disabled{cursor:default;}
  button{
    font-family:inherit;
    font-size:15px;
    font-weight:700;
    border:none;
    border-radius:12px;
    padding:13px 18px;
    cursor:pointer;
    transition:transform .1s ease, opacity .15s ease;
  }
  button:active{transform:scale(0.97);}
  .btn-submit{
    flex:1;
    background:var(--seal);
    color:#fff;
  }
  .btn-idk{
    background:transparent;
    color:var(--muted);
    border:1.5px solid var(--line);
    padding:13px 16px;
  }
  .btn-next{
    flex:1;
    background:var(--ink);
    color:#fff;
  }

  .feedback{
    margin-top:16px;
    border-radius:12px;
    padding:14px 16px;
    text-align:left;
    font-size:14px;
    line-height:1.55;
    animation:pop .25s ease;
  }
  @keyframes pop{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
  .feedback.correct{
    background:rgba(76,122,94,0.10);
    border:1px solid rgba(76,122,94,0.35);
  }
  .feedback.wrong{
    background:rgba(178,58,46,0.07);
    border:1px solid rgba(178,58,46,0.28);
  }
  .feedback-title{
    font-weight:700;
    margin-bottom:6px;
  }
  .feedback.correct .feedback-title{color:var(--green);}
  .feedback.wrong .feedback-title{color:var(--seal-dark);}
  .feedback-answer{
    font-family:'Noto Serif Thai','Georgia',serif;
    font-size:17px;font-weight:700;
  }
  .feedback-your{
    color:var(--muted);font-size:13px;margin-top:4px;
  }

  .done-wrap{
    text-align:center;padding:20px 4px;
  }
  .done-seal{
    width:72px;height:72px;border-radius:50%;
    background:var(--seal);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:30px;margin:0 auto 16px;
    box-shadow:0 8px 20px -8px rgba(178,58,46,0.6);
  }
  .done-title{font-family:'Noto Serif Thai',serif;font-size:24px;font-weight:700;margin-bottom:6px;}
  .done-sub{color:var(--muted);font-size:14px;margin-bottom:22px;}
  .done-stats{
    display:flex;justify-content:center;gap:28px;margin-bottom:26px;
  }
  .done-stat b{display:block;font-size:26px;}
  .done-stat span{font-size:12px;color:var(--muted);}

  .review-list{
    text-align:left;
    max-height:200px;
    overflow-y:auto;
    border-top:1px solid var(--line);
    margin-top:8px;
    padding-top:12px;
  }

    display:flex;justify-content:space-between;
    font-size:13px;
    padding:6px 2px;
    border-bottom:1px dashed var(--line);
  }
  .review-item .rp{color:var(--seal-dark);font-weight:700;}
  .review-item .rt{color:var(--muted);}

  .footer-actions{
    display:flex;gap:10px;margin-top:20px;
  }

  .setup{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    padding:28px 24px;
    box-shadow:0 1px 0 rgba(0,0,0,0.03), 0 12px 30px -18px rgba(43,38,32,0.35);
  }
  .setup h2{
    font-family:'Noto Serif Thai',serif;
    font-size:19px;margin:0 0 4px;
  }
  .setup p{font-size:13px;color:var(--muted);margin:0 0 18px;}
  .opt-group{margin-bottom:18px;}
  .opt-label{font-size:12px;font-weight:700;color:var(--ink);margin-bottom:8px;letter-spacing:.03em;}
  .opt-row{display:flex;gap:8px;flex-wrap:wrap;}
  .opt-btn{
    flex:1;
    min-width:100px;
    background:#fff;
    border:1.5px solid var(--line);
    border-radius:10px;
    padding:11px 10px;
    font-size:13px;
    font-weight:600;
    color:var(--muted);
    text-align:center;
    cursor:pointer;
  }
  .opt-btn.active{
    border-color:var(--seal);
    color:var(--seal-dark);
    background:rgba(178,58,46,0.06);
  }
  .range-row{display:flex;align-items:center;gap:10px;}
  input[type=number]{
    width:70px;padding:10px;border-radius:10px;border:1.5px solid var(--line);
    text-align:center;font-size:15px;font-family:inherit;
  }
  .start-btn{
    width:100%;background:var(--seal);color:#fff;padding:15px;font-size:16px;border-radius:12px;margin-top:6px;
  }

  .skip-link{
    text-align:center;margin-top:16px;font-size:12px;color:var(--muted);cursor:pointer;text-decoration:underline;
  }
</style>
</head>

<script>
const STORAGE_KEY = 'hsk1_progress_v1';

let state = {
  screen: 'setup', // setup | quiz | done
  mode: 'py2th',    // py2th = show pinyin, guess thai | th2py = show thai, guess pinyin | mixed
  startIndex: 0,    // 0-based index into VOCAB
  endIndex: VOCAB.length - 1,
  cursor: 0,        // current position in VOCAB (0-based)
  correctCount: 0,
  wrongCount: 0,
  wrongList: [],    // list of {n,py,th}
  currentAnswered: false,
  lastCorrect: null,
  lastUserAnswer: '',
  choices: [],       // array of 4 strings for current question
  selectedChoice: null
};

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function buildChoices(){
  const w = currentWord();
  const dir = currentDirection();
  const isPy2Th = dir === 'py2th';
  const correctAns = isPy2Th ? w.th : w.py;
  const field = isPy2Th ? 'th' : 'py';

  // pool of other words to draw distractors from, excluding current word's index
  const pool = VOCAB.filter((v,i) => i !== state.cursor).map(v => v[field]);
  // dedupe distractor values, exclude anything equal to the correct answer
  const uniquePool = [...new Set(pool)].filter(v => v !== correctAns);
  const distractors = shuffle(uniquePool).slice(0,3);
  state.choices = shuffle([correctAns, ...distractors]);
  state.selectedChoice = null;
}

function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return null;
}
function saveProgress(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      cursor: state.cursor,
      mode: state.mode,
      startIndex: state.startIndex,
      endIndex: state.endIndex
    }));
  }catch(e){}
}

function normalize(str){
  return str.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'') // strip tone diacritics for pinyin comparison
    .replace(/[^a-zก-๙0-9]/g,'')
    .trim();
}

function currentWord(){
  return VOCAB[state.cursor];
}

function currentDirection(){
  if(state.mode === 'mixed'){
    // deterministic-ish based on index so it's stable but varied
    return (state.cursor % 2 === 0) ? 'py2th' : 'th2py';
  }
  return state.mode;
}

function render(){
  const app = document.getElementById('app');
  if(state.screen === 'setup') app.innerHTML = renderSetup();
  else if(state.screen === 'quiz') app.innerHTML = renderQuiz();
  else if(state.screen === 'done') app.innerHTML = renderDone();
  attachHandlers();
}

function renderSetup(){
  const saved = loadProgress();
  const resumeBlock = saved ? `
    <div class="skip-link" id="resumeLink">▸ ทำต่อจากคำที่ ${saved.cursor+1} (มีการบันทึกไว้)</div>
  ` : '';

  return `
  <div class="setup">
    <h2>ตั้งค่าก่อนเริ่ม</h2>
    <p>เลือกรูปแบบคำถามและช่วงคำศัพท์</p>

    <div class="opt-group">
      <div class="opt-label">รูปแบบคำถาม</div>
      <div class="opt-row">
        <div class="opt-btn ${state.mode==='py2th'?'active':''}" data-mode="py2th">ดูพินอิน<br>ทายคำแปลไทย</div>
        <div class="opt-btn ${state.mode==='th2py'?'active':''}" data-mode="th2py">ดูคำแปลไทย<br>ทายพินอิน</div>
      </div>
      <div class="opt-row" style="margin-top:8px;">
        <div class="opt-btn ${state.mode==='mixed'?'active':''}" data-mode="mixed">สลับทั้งสองแบบ</div>
      </div>
    </div>

    <div class="opt-group">
      <div class="opt-label">ช่วงคำศัพท์ (ตามลำดับเดิม 1–149)</div>
      <div class="range-row">
        <span style="font-size:13px;color:var(--muted);">จาก</span>
        <input type="number" id="startNum" min="1" max="149" value="${state.startIndex+1}">
        <span style="font-size:13px;color:var(--muted);">ถึง</span>
        <input type="number" id="endNum" min="1" max="149" value="${state.endIndex+1}">
      </div>
    </div>

    <button class="start-btn" id="startBtn">เริ่มท่องศัพท์</button>
    ${resumeBlock}
  </div>
  `;
}

function renderQuiz(){
  const w = currentWord();
  const dir = currentDirection();
  const isPy2Th = dir === 'py2th';
  const promptLabel = isPy2Th ? 'คำอ่านนี้ (พินอิน)' : 'คำแปลนี้ (ไทย)';
  const promptText = isPy2Th ? w.py : w.th;
  const promptClass = isPy2Th ? 'pinyin' : 'thai';
  const askLabel = isPy2Th ? 'แปลว่าอะไร? เลือกคำตอบ' : 'อ่านว่าอะไร? เลือกคำตอบ';

  const total = state.endIndex - state.startIndex + 1;
  const doneCount = state.cursor - state.startIndex;
  const pct = Math.round((doneCount/total)*100);

  const correctAns = isPy2Th ? w.th : w.py;
  const tags = ['ก','ข','ค','ง'];

  let feedbackHtml = '';
  if(state.currentAnswered){
    if(state.lastCorrect){
      feedbackHtml = `
        <div class="feedback correct">
          <div class="feedback-title">✓ ถูกต้อง!</div>
          <div class="feedback-answer">${escapeHtml(correctAns)}</div>
        </div>`;
    } else {
      feedbackHtml = `
        <div class="feedback wrong">
          <div class="feedback-title">✗ ยังไม่ถูก — เฉลย:</div>
          <div class="feedback-answer">${escapeHtml(correctAns)}</div>
        </div>`;
    }
  }

  const choicesHtml = `
    <div class="choice-grid">
      ${state.choices.map((choice, idx) => {
        let cls = 'choice-btn';
        if(state.currentAnswered){
          if(choice === correctAns) cls += ' correct';
          else if(choice === state.selectedChoice) cls += ' wrong';
          else cls += ' dim';
        }
        return `<button type="button" class="${cls}" data-choice="${idx}" ${state.currentAnswered?'disabled':''}>
          <span class="choice-tag">${tags[idx]}</span>
          <span>${escapeHtml(choice)}</span>
        </button>`;
      }).join('')}
    </div>
    <div class="prompt-label" style="margin-top:14px;margin-bottom:0;">${state.currentAnswered ? '' : askLabel}</div>
  `;

  const formOrNext = state.currentAnswered ? `
    <div class="actions">
      <button class="btn-next" id="nextBtn">คำถัดไป →</button>
    </div>
  ` : choicesHtml;

  return `
    <div class="progress-row">
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="progress-num">${doneCount}/${total}</div>
    </div>
    <div class="stats">
      <div>คำที่ <b>${w.n}</b> จาก 149</div>
      <div><span class="stat-ok">✓ ${state.correctCount}</span> &nbsp; <span class="stat-no">✗ ${state.wrongCount}</span></div>
    </div>

    <div class="card">
      <div class="card-index">#${w.n}</div>
      <div class="card-mode">${isPy2Th ? 'พินอิน → ไทย' : 'ไทย → พินอิน'}</div>
      <div class="prompt-label">${promptLabel}</div>
      <div class="prompt-text ${promptClass}">${escapeHtml(promptText)}</div>

      ${formOrNext}
      ${feedbackHtml}
    </div>
    <div class="skip-link" id="quitBtn">■ หยุดพักและกลับหน้าตั้งค่า</div>
  `;
}

function renderDone(){
  const total = state.wrongCount + state.correctCount;
  const pctCorrect = total ? Math.round((state.correctCount/total)*100) : 0;
  const reviewHtml = state.wrongList.length ? `
    <div class="review-list">
      ${state.wrongList.map(w => `
        <div class="review-item">
          <span class="rp">#${w.n} ${escapeHtml(w.py)}</span>
          <span class="rt">${escapeHtml(w.th)}</span>
        </div>
      `).join('')}
    </div>
  ` : `<div style="text-align:center;color:var(--muted);font-size:13px;margin-top:8px;">ไม่มีคำที่ตอบผิดเลย เก่งมาก!</div>`;

  return `
  <div class="card done-wrap">
    <div class="done-seal">完</div>
    <div class="done-title">จบชุดคำศัพท์แล้ว</div>
    <div class="done-sub">คำที่ ${state.startIndex+1}–${state.endIndex+1}</div>
    <div class="done-stats">
      <div class="done-stat"><b class="stat-ok">${state.correctCount}</b><span>ตอบถูก</span></div>
      <div class="done-stat"><b class="stat-no">${state.wrongCount}</b><span>ตอบผิด</span></div>
      <div class="done-stat"><b>${pctCorrect}%</b><span>ความแม่นยำ</span></div>
    </div>
    ${state.wrongList.length ? '<div class="opt-label" style="text-align:left;">คำที่ควรทบทวน</div>' : ''}
    ${reviewHtml}
    <div class="footer-actions">
      <button class="btn-idk" id="backSetupBtn" style="flex:1;">กลับหน้าตั้งค่า</button>
      <button class="btn-submit" id="restartBtn" style="flex:1;">ทำซ้ำชุดนี้</button>
    </div>
  </div>
  `;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function attachHandlers(){
  if(state.screen === 'setup'){
    document.querySelectorAll('.opt-btn[data-mode]').forEach(btn => {
      btn.addEventListener('click', () => {
        state.mode = btn.dataset.mode;
        render();
      });
    });
    document.getElementById('startBtn').addEventListener('click', () => {
      const s = Math.min(Math.max(parseInt(document.getElementById('startNum').value)||1,1),149);
      const e = Math.min(Math.max(parseInt(document.getElementById('endNum').value)||149,1),149);
      state.startIndex = Math.min(s,e)-1;
      state.endIndex = Math.max(s,e)-1;
      state.cursor = state.startIndex;
      state.correctCount = 0;
      state.wrongCount = 0;
      state.wrongList = [];
      state.currentAnswered = false;
      state.screen = 'quiz';
      buildChoices();
      render();
    });
    const resumeLink = document.getElementById('resumeLink');
    if(resumeLink){
      resumeLink.addEventListener('click', () => {
        const saved = loadProgress();
        if(saved){
          state.mode = saved.mode;
          state.startIndex = saved.startIndex;
          state.endIndex = saved.endIndex;
          state.cursor = Math.min(saved.cursor, saved.endIndex);
          state.correctCount = 0;
          state.wrongCount = 0;
          state.wrongList = [];
          state.currentAnswered = false;
          state.screen = 'quiz';
          buildChoices();
          render();
        }
      });
    }
  } else if(state.screen === 'quiz'){
    document.querySelectorAll('.choice-btn[data-choice]').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = parseInt(btn.dataset.choice);
        submitChoice(state.choices[idx]);
      });
    });
    const nextBtn = document.getElementById('nextBtn');
    if(nextBtn){
      nextBtn.addEventListener('click', advance);
    }
    document.getElementById('quitBtn').addEventListener('click', () => {
      saveProgress();
      state.screen = 'setup';
      render();
    });
  } else if(state.screen === 'done'){
    document.getElementById('backSetupBtn').addEventListener('click', () => {
      try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
      state.screen = 'setup';
      render();
    });
    document.getElementById('restartBtn').addEventListener('click', () => {
      state.cursor = state.startIndex;
      state.correctCount = 0;
      state.wrongCount = 0;
      state.wrongList = [];
      state.currentAnswered = false;
      state.screen = 'quiz';
      buildChoices();
      render();
    });
  }
}

function submitChoice(choice){
  if(state.currentAnswered) return;
  const w = currentWord();
  const dir = currentDirection();
  const isPy2Th = dir === 'py2th';
  const correctAns = isPy2Th ? w.th : w.py;

  const isCorrect = choice === correctAns;

  state.currentAnswered = true;
  state.lastCorrect = isCorrect;
  state.selectedChoice = choice;

  if(isCorrect){
    state.correctCount++;
  } else {
    state.wrongCount++;
    state.wrongList.push({n:w.n, py:w.py, th:w.th});
  }
  render();
}

function advance(){
  state.currentAnswered = false;
  if(state.cursor >= state.endIndex){
    try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
    state.screen = 'done';
  } else {
    state.cursor++;
    buildChoices();
    saveProgress();
  }
  render();
}

render();
</script>
</body>
</html>
